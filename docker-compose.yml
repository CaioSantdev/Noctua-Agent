services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_agent}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./noctua_database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  permissoes_arquivos:
    image: busybox:1.37
    command: ["sh", "-c", "chown -R 10001:10001 /app/arquivos"]
    volumes:
      - documentos_data:/app/arquivos

  backend:
    build:
      context: ./noctua_backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-knowledge_agent}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-knowledge_agent}
      DIRETORIO_ARQUIVOS: /app/arquivos
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      permissoes_arquivos:
        condition: service_completed_successfully
    volumes:
      - documentos_data:/app/arquivos

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./noctua_backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-knowledge_agent}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-knowledge_agent}
      DIRETORIO_ARQUIVOS: /app/arquivos
      REDIS_URL: redis://redis:6379/0
    command: ["uv", "run", "--no-sync", "celery", "-A", "app.infrastructure.celery.aplicacao_celery", "worker", "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      permissoes_arquivos:
        condition: service_completed_successfully
    volumes:
      - documentos_data:/app/arquivos

  frontend:
    build:
      context: ./noctua_frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./noctua_frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  documentos_data:
  redis_data:
