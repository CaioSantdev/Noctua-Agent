[project]
name = "noctua-backend"
version = "0.1.0"
description = "API do projeto Noctua"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "openai>=1.0,<2.0",
  "pyjwt>=2.10,<3.0",
  "pgvector>=0.3,<1.0",
  "pypdf>=5.0,<6.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-multipart>=0.0.18,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "tiktoken>=0.8,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "tenacity>=9.0,<10.0",
  "celery>=5.6.3",
  "redis>=8.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "httpx>=0.28,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
